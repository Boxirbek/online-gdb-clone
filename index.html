<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>GDB Online Debugger | Compiler - C++</title>
    <link rel="icon" type="image/png" href="./images.jpg">
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #333; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Yuqori Panel */
        .top-nav { background: #444; height: 40px; display: flex; align-items: center; padding: 0 10px; gap: 5px; border-bottom: 1px solid #555; position: relative; }
        .btn { border: none; padding: 4px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; color: white; display: flex; align-items: center; gap: 4px; }
        .btn-run { background: #5cb85c; } 
        .btn-debug { background: #5bc0de; } 
        .btn-stop { background: #d9534f; } 
        .btn-share { background: #f0ad4e; } 
        .btn-save { background: #337ab7; } 
        .btn-beautify { background: #66afe9; }
        
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* Chap menyu */
        .sidebar { width: 180px; background: #2c3e50; font-size: 13px; display: flex; flex-direction: column; }
        .sidebar div { padding: 10px 15px; border-bottom: 1px solid #34495e; cursor: pointer; }
        .sidebar div:hover { background: #3e5871; }
        .sidebar .active { background: #1a252f; border-left: 4px solid #337ab7; }

        /* Markaz - Editor va Reklama */
        .content-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .editor-header { background: #4d4d4d; height: 30px; display: flex; align-items: center; padding-left: 10px; font-size: 12px; }
        .editor-main { display: flex; flex: 1; }
        #editor { flex: 1; background: #262626; color: #f8f8f2; border: none; padding: 10px; font-family: 'Consolas', monospace; font-size: 14px; outline: none; resize: none; }
        
        /* O'ng tomon - Bo'sh reklama joyi */
        .ad-right { width: 160px; background: #3d3d3d; border-left: 1px solid #555; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666; text-align: center; }

        /* Pastki qism */
        .footer-panel { background: #f5f5f5; color: #333; height: 180px; padding: 10px; box-sizing: border-box; }
        .input-box { width: 100%; border: 1px solid #ccc; padding: 5px; margin-top: 5px; font-family: monospace; }
        .output-area { background: #000; color: #0f0; height: 80px; padding: 5px; margin-top: 10px; font-family: monospace; font-size: 12px; overflow-y: auto; }
        
        /* Yashirin buyruq satri - aynan shu yerga yozasiz */
        #secret-cmd { 
            position: absolute; 
            right: 10px; 
            top: 8px; 
            opacity: 0.1; /* Juda xira, deyarli ko'rinmaydi */
            width: 40px; 
            background: transparent; 
            border: none; 
            color: white; 
            outline: none;
            transition: opacity 0.3s;
        }
        #secret-cmd:focus { opacity: 1; background: #222; width: 100px; border: 1px solid #555; }
    </style>
</head>
<body>

<div class="top-nav">
    <div style="font-weight: bold; font-style: italic; margin-right: 20px; color: #eee;">OnlineGDB</div>
    <button class="btn btn-run" onclick="runTask()">▶ Yugurish</button>
    <button class="btn btn-debug">⚙ Nosozliklarni tuzatish</button>
    <button class="btn btn-stop">■ STOP</button>
    <button class="btn btn-share">🔗 Ulashish</button>
    <button class="btn btn-save">💾 Saqlash</button>
    <button class="btn btn-beautify">{} Obodonlashtirish</button>
    
    <!-- Kalit so'z shu yerga yoziladi (masalan: if-1) -->
    <input type="text" id="secret-cmd" placeholder="...">
</div>

<div class="main-wrapper">
    <div class="sidebar">
        <div class="active">IDE</div>
        <div>Mening loyihalarim</div>
        <div>Sinf xonasi <span style="background: red; font-size: 9px; border-radius: 3px; padding: 1px 3px;">yangi</span></div>
        <div>Dasturlashni o'rganing</div>
        <div>Dasturlash bo'yicha savollar</div>
        <div>Ro'yxatdan o'tish</div>
    </div>

    <div class="content-area">
        <div class="editor-header">main.cpp</div>
        <div class="editor-main">
            <textarea id="editor" spellcheck="false">#include <iostream>
using namespace std;

int main()
{
    cout << "Salom Dunyo";
    return 0;
}</textarea>
            <div class="ad-right">REKLAMA YOPISH [x]</div>
        </div>
    </div>
</div>

<div class="footer-panel">
    <div style="font-size: 12px; font-weight: bold;">Buyruq satri argumentlari:</div>
    <input type="text" class="input-box" placeholder="kiritish">
    <div class="output-area" id="console-output">
        Compiling program...<br>
        Compilation finished.
    </div>
</div>

<script>
    const misollar = {
        "case": {
            "1": "#include <iostream>\nusing namespace std;\nint main() {\n    int kun; cin >> kun;\n    switch(kun) {\n        case 1: cout << \"Dushanba\"; break;\n        case 2: cout << \"Seshanba\"; break;\n        case 3: cout << \"Chorshanba\"; break;\n        case 4: cout << \"Payshanba\"; break;\n        case 5: cout << \"Juma\"; break;\n        case 6: cout << \"Shanba\"; break;\n        case 7: cout << \"Yakshanba\"; break;\n        default: cout << \"Xato!\";\n    }\n    return 0;\n}",
            "2": "#include <iostream>\nusing namespace std;\nint main() {\n    int k; cin >> k;\n    switch(k) {\n        case 1: cout << \"yomon\"; break;\n        case 2: cout << \"qoniqarsiz\"; break;\n        case 3: cout << \"qoniarli\"; break;\n        case 4: cout << \"yaxshi\"; break;\n        case 5: cout << \"a'lo\"; break;\n        default: cout << \"xato\";\n    }\n    return 0;\n}",
            "3": "#include <iostream>\nusing namespace std;\nint main() {\n    int oy; cin >> oy;\n    switch(oy) {\n        case 12: case 1: case 2: cout << \"qish\"; break;\n        case 3: case 4: case 5: cout << \"bahor\"; break;\n        case 6: case 7: case 8: cout << \"yoz\"; break;\n        case 9: case 10: case 11: cout << \"kuz\"; break;\n        default: cout << \"xato\";\n    }\n    return 0;\n}",
            "4": "#include <iostream>\nusing namespace std;\nint main() {\n    int oy; cin >> oy;\n    switch(oy) {\n        case 2: cout << \"28 kun\"; break;\n        case 4: case 6: case 9: case 11: cout << \"30 kun\"; break;\n        default: cout << \"31 kun\";\n    }\n    return 0;\n}",
            "5": "#include <iostream>\nusing namespace std;\nint main() {\n    double a, b; int am; cin >> a >> b >> am;\n    switch(am) {\n        case 1: cout << a+b; break;\n        case 2: cout << a-b; break;\n        case 3: cout << a/b; break;\n        case 4: cout << a*b; break;\n    }\n    return 0;\n}",
            "6": "#include <iostream>\nusing namespace std;\nint main() {\n    int b; double u; cin >> b >> u;\n    switch(b) {\n        case 1: cout << u*0.1; break;\n        case 2: cout << u*1000; break;\n        case 3: cout << u; break;\n        case 4: cout << u*0.001; break;\n        case 5: cout << u*0.01; break;\n    }\n    return 0;\n}",
            "7": "#include <iostream>\nusing namespace std;\nint main() {\n    int b; double q; cin >> b >> q;\n    switch(b) {\n        case 1: cout << q; break;\n        case 2: cout << q*0.000001; break;\n        case 3: cout << q*0.001; break;\n        case 4: cout << q*1000; break;\n        case 5: cout << q*100; break;\n    }\n    return 0;\n}",
            "8": "#include <iostream>\nusing namespace std;\nint main() {\n    int d, m; cin >> d >> m;\n    cout << d << \"-oy\";\n    return 0;\n}",
            "9": "#include <iostream>\nusing namespace std;\nint main() {\n    int d, m; cin >> d >> m;\n    d++; cout << d << \".\" << m;\n    return 0;\n}",
            "10": "#include <iostream>\nusing namespace std;\nint main() {\n    char y; int k; cin >> y >> k;\n    cout << \"Yo'nalish o'zgardi\";\n    return 0;\n}"
        },
        "if": {
            "1": "#include <iostream>\nusing namespace std;\nint main() { int n; cin >> n; if(n>0) n++; cout << n; return 0; }",
            "2": "#include <iostream>\nusing namespace std;\nint main() { int n; cin >> n; if(n>0) n++; else n-=2; cout << n; return 0; }",
            "3": "#include <iostream>\nusing namespace std;\nint main() { int n; cin >> n; if(n>0) n++; else if(n<0) n-=2; else n=10; cout << n; return 0; }",
            "4": "#include <iostream>\nusing namespace std;\nint main() { int a,b,c,s=0; cin>>a>>b>>c; if(a>0)s++; if(b>0)s++; if(c>0)s++; cout<<s; return 0; }",
            "5": "#include <iostream>\nusing namespace std;\nint main() { int a,b,c,p=0,m=0; cin>>a>>b>>c; if(a>0)p++; else if(a<0)m++; if(b>0)p++; else if(b<0)m++; if(c>0)p++; else if(c<0)m++; cout<<\"+\"<<p<<\"-\"<<m; return 0; }",
            "6": "#include <iostream>\nusing namespace std;\nint main() { int a,b; cin>>a>>b; cout<<(a>b?a:b); return 0; }",
            "7": "#include <iostream>\nusing namespace std;\nint main() { int a,b; cin>>a>>b; cout<<(a<b?1:2); return 0; }",
            "8": "#include <iostream>\nusing namespace std;\nint main() { int a,b; cin>>a>>b; if(a>b) cout<<a<<\" \"<<b; else cout<<b<<\" \"<<a; return 0; }",
            "9": "#include <iostream>\nusing namespace std;\nint main() { double a,b; cin>>a>>b; if(a>b) {double t=a; a=b; b=t;} cout<<a<<\" \"<<b; return 0; }",
            "10": "#include <iostream>\nusing namespace std;\nint main() { int a,b; cin>>a>>b; if(a!=b) a=b=a+b; else a=b=0; cout<<a<<\" \"<<b; return 0; }"
        },
        "while": {
            "1": "#include <iostream>\nusing namespace std;\nint main() { int a,b; cin>>a>>b; while(a>=b) a-=b; cout<<a; return 0; }",
            "2": "#include <iostream>\nusing namespace std;\nint main() { int a,b,s=0; cin>>a>>b; while(a>=b) {a-=b; s++;} cout<<s; return 0; }",
            "3": "#include <iostream>\nusing namespace std;\nint main() { int n,k,b=0; cin>>n>>k; while(n>=k) {n-=k; b++;} cout<<b<<\" \"<<n; return 0; }",
            "4": "#include <iostream>\nusing namespace std;\nint main() { int n; cin>>n; while(n>1){if(n%3!=0) break; n/=3;} cout<<(n==1?\"Ha\":\"Yoq\"); return 0; }",
            "5": "#include <iostream>\nusing namespace std;\nint main() { int n,k=0; cin>>n; while(n>1){n/=2; k++;} cout<<k; return 0; }",
            "6": "#include <iostream>\nusing namespace std;\nint main() { int n; double r=1; cin>>n; while(n>0){r*=n; n-=2;} cout<<r; return 0; }",
            "7": "#include <iostream>\nusing namespace std;\nint main() { int n,k=1; cin>>n; while(k*k<=n) k++; cout<<k; return 0; }",
            "8": "#include <iostream>\nusing namespace std;\nint main() { int n,k=1; cin>>n; while((k+1)*(k+1)<=n) k++; cout<<k; return 0; }",
            "9": "#include <iostream>\nusing namespace std;\nint main() { int n,k=1,p=3; cin>>n; while(p<=n){p*=3; k++;} cout<<k; return 0; }",
            "10": "#include <iostream>\nusing namespace std;\nint main() { int n,k=0,p=1; cin>>n; while(p*3<=n){p*=3; k++;} cout<<k; return 0; }"
        },
        "integer": {
            "1": "#include <iostream>\nusing namespace std;\nint main() { int l; cin>>l; cout<<l/100; return 0; }",
            "2": "#include <iostream>\nusing namespace std;\nint main() { int m; cin>>m; cout<<m/1000; return 0; }",
            "3": "#include <iostream>\nusing namespace std;\nint main() { int b; cin>>b; cout<<b/1024; return 0; }",
            "4": "#include <iostream>\nusing namespace std;\nint main() { int a,b; cin>>a>>b; cout<<a/b; return 0; }",
            "5": "#include <iostream>\nusing namespace std;\nint main() { int a,b; cin>>a>>b; cout<<a%b; return 0; }",
            "6": "#include <iostream>\nusing namespace std;\nint main() { int n; cin>>n; cout<<n/10<<\" \"<<n%10; return 0; }",
            "7": "#include <iostream>\nusing namespace std;\nint main() { int n; cin>>n; cout<<n/10+n%10; return 0; }",
            "8": "#include <iostream>\nusing namespace std;\nint main() { int n; cin>>n; cout<<(n%10)*10+n/10; return 0; }",
            "9": "#include <iostream>\nusing namespace std;\nint main() { int n; cin>>n; cout<<n/100; return 0; }",
            "10": "#include <iostream>\nusing namespace std;\nint main() { int n; cin>>n; cout<<n%10<<\" \"<<(n/10)%10; return 0; }",
            "11": "#include <iostream>\nusing namespace std;\nint main() { int n; cin>>n; cout<<n/100+(n/10)%10+n%10; return 0; }",
            "12": "#include <iostream>\nusing namespace std;\nint main() { int n; cin>>n; cout<<(n%10)*100+((n/10)%10)*10+n/100; return 0; }"
        },
        "for": {
            "1": "#include <iostream>\nusing namespace std;\nint main() { int k,n; cin>>k>>n; for(int i=0;i<n;i++) cout<<k<<\" \"; return 0; }",
            "2": "#include <iostream>\nusing namespace std;\nint main() { int a,b,c=0; cin>>a>>b; for(int i=a;i<=b;i++){cout<<i<<\" \"; c++;} cout<<endl<<c; return 0; }",
            "3": "#include <iostream>\nusing namespace std;\nint main() { int a,b,c=0; cin>>a>>b; for(int i=b-1;i>a;i--){cout<<i<<\" \"; c++;} cout<<endl<<c; return 0; }",
            "4": "#include <iostream>\nusing namespace std;\nint main() { double n; cin>>n; for(int i=1;i<=10;i++) cout<<i*n<<endl; return 0; }",
            "5": "#include <iostream>\nusing namespace std;\nint main() { double n; cin>>n; for(double i=0.1;i<=1.0;i+=0.1) cout<<i*n<<endl; return 0; }",
            "6": "#include <iostream>\nusing namespace std;\nint main() { double n; cin>>n; for(double i=1.2;i<=2.0;i+=0.2) cout<<i*n<<endl; return 0; }",
            "7": "#include <iostream>\nusing namespace std;\nint main() { int a,b,s=0; cin>>a>>b; for(int i=a;i<=b;i++) s+=i; cout<<s; return 0; }",
            "8": "#include <iostream>\nusing namespace std;\nint main() { int a,b; long long p=1; cin>>a>>b; for(int i=a;i<=b;i++) p*=i; cout<<p; return 0; }",
            "9": "#include <iostream>\nusing namespace std;\nint main() { int a,b; long long s=0; cin>>a>>b; for(int i=a;i<=b;i++) s+=i*i; cout<<s; return 0; }",
            "10": "#include <iostream>\nusing namespace std;\nint main() { int n; double s=0; cin>>n; for(int i=1;i<=n;i++) s+=1.0/i; cout<<s; return 0; }"
        }
    };

    function runTask() {
        const cmdInput = document.getElementById('secret-cmd');
        const cmd = cmdInput.value.toLowerCase().trim();
        const editor = document.getElementById('editor');
        const output = document.getElementById('console-output');

        if (cmd.includes('-')) {
            const parts = cmd.split('-');
            const mavzu = parts[0];
            const raqam = parts[1];

            if (misollar[mavzu] && misollar[mavzu][raqam]) {
                editor.value = misollar[mavzu][raqam];
                output.innerHTML = "Compiling program...<br><span style='color: #0f0;'>Compilation finished.</span><br>--- Program Output ---";
                return;
            }
        }
        
        // Agar kalit so'z bo'lmasa yoki noto'g'ri bo'lsa, oddiy "Salom Dunyo" chiqadi
        output.innerHTML = "Compiling program...<br>Salom Dunyo<br><br>Process returned 0 (0x0)";
    }
</script>

</body>
</html>
