<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDB Online Debugger | Gemini AI</title>
    <link rel="icon" type="image/png" href="image_21de39.png">
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-nav { background: #333; height: 45px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-bottom: 1px solid #444; }
        .logo { font-weight: bold; color: #5cb85c; font-style: italic; margin-right: 15px; }
        .btn { border: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; color: white; font-weight: 600; transition: 0.2s; }
        .btn-run { background: #5cb85c; } .btn-run:hover { background: #4cae4c; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 200px; background: #252526; border-right: 1px solid #333; font-size: 14px; }
        .sidebar-item { padding: 12px 20px; border-bottom: 1px solid #2d2d2d; cursor: pointer; color: #ccc; }
        .sidebar-item:hover { background: #2a2d2e; color: #fff; }
        .editor-area { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
        #editor { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 20px; font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; outline: none; resize: none; }
        .console { height: 150px; background: #000; color: #00ff00; padding: 10px; font-family: monospace; font-size: 13px; border-top: 5px solid #333; overflow-y: auto; }
        
        /* AI Chat Oynasi */
        #chat-container { position: fixed; bottom: 20px; right: 20px; width: 320px; background: #252526; border: 1px solid #007acc; border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 5px 25px rgba(0,0,0,0.5); z-index: 9999; }
        .chat-header { background: #007acc; color: white; padding: 10px; border-radius: 7px 7px 0 0; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; }
        .chat-box { height: 250px; overflow-y: auto; padding: 15px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; background: #1e1e1e; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 85%; line-height: 1.4; }
        .user-msg { background: #007acc; align-self: flex-end; color: white; }
        .ai-msg { background: #333; align-self: flex-start; color: #d4d4d4; border: 1px solid #444; }
        .chat-input-wrapper { padding: 10px; display: flex; background: #252526; border-top: 1px solid #333; }
        #user-input { flex: 1; background: #3c3c3c; border: 1px solid #555; color: white; padding: 8px; border-radius: 4px; outline: none; font-size: 13px; }
        .send-btn { background: #007acc; border: none; color: white; margin-left: 8px; cursor: pointer; padding: 5px 12px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="logo">OnlineGDB Clone</div>
    <button class="btn btn-run">▶ Run</button>
    <button class="btn" style="background: #337ab7;">💾 Save</button>
</div>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-item">Main.cpp</div>
        <div class="sidebar-item">Input Files</div>
        <div class="sidebar-item">Settings</div>
    </div>
    <div class="editor-area">
        <textarea id="editor" spellcheck="false">#include <iostream>
using namespace std;

int main() {
    cout << "Salom Dunyo!" << endl;
    return 0;
}</textarea>
        <div class="console" id="console">Compiling... Done. <br> Salom Dunyo!</div>
    </div>
</div>

<!-- Gemini Chat Oynasi -->
<div id="chat-container">
    <div class="chat-header">💎 Gemini AI Yordamchi</div>
    <div class="chat-box" id="chat-box">
        <div class="msg ai-msg">Salom! Men Gemini AI-man. Dasturlash bo'yicha savolingiz bormi?</div>
    </div>
    <div class="chat-input-wrapper">
        <input type="text" id="user-input" placeholder="Savol yozing...">
        <button class="send-btn" onclick="askAI()">➤</button>
    </div>
</div>

<script>
    async function askAI() {
        const input = document.getElementById('user-input');
        const box = document.getElementById('chat-box');
        const text = input.value.trim();
        if (!text) return;

        // Foydalanuvchi xabari
        box.innerHTML += `<div class="msg user-msg">${text}</div>`;
        input.value = '';
        box.scrollTop = box.scrollHeight;

        // Loading
        const loadingId = 'loading-' + Date.now();
        box.innerHTML += `<div class="msg ai-msg" id="${loadingId}">O'ylayapman...</div>`;
        box.scrollTop = box.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });
            const data = await response.json();
            document.getElementById(loadingId).innerText = data.text;
        } catch (error) {
            document.getElementById(loadingId).innerText = "Xatolik yuz berdi. API kalitni tekshiring.";
        }
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
