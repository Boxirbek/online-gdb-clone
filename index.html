<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>GDB Online Debugger | Compiler - C++</title>
    <link rel="icon" type="image/png" href="./images.jpg">
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #333; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Yuqori Panel */
        .top-nav { background: #444; height: 40px; display: flex; align-items: center; padding: 0 10px; gap: 5px; border-bottom: 1px solid #555; position: relative; }
        .btn { border: none; padding: 4px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; color: white; display: flex; align-items: center; gap: 4px; }
        .btn-run { background: #5cb85c; } 
        .btn-debug { background: #5bc0de; } 
        .btn-stop { background: #d9534f; } 
        .btn-share { background: #f0ad4e; } 
        .btn-save { background: #337ab7; } 
        .btn-beautify { background: #66afe9; }
        
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* Chap menyu */
        .sidebar { width: 180px; background: #2c3e50; font-size: 13px; display: flex; flex-direction: column; }
        .sidebar div { padding: 10px 15px; border-bottom: 1px solid #34495e; cursor: pointer; }
        .sidebar div:hover { background: #3e5871; }
        .sidebar .active { background: #1a252f; border-left: 4px solid #337ab7; }

        /* Markaz - Editor va Reklama */
        .content-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .editor-header { background: #4d4d4d; height: 30px; display: flex; align-items: center; padding-left: 10px; font-size: 12px; }
        .editor-main { display: flex; flex: 1; }
        #editor { flex: 1; background: #262626; color: #f8f8f2; border: none; padding: 10px; font-family: 'Consolas', monospace; font-size: 14px; outline: none; resize: none; }
        
        /* O'ng tomon - Bo'sh reklama joyi */
        .ad-right { width: 160px; background: #3d3d3d; border-left: 1px solid #555; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666; text-align: center; }

        /* Pastki qism */
        .footer-panel { background: #f5f5f5; color: #333; height: 180px; padding: 10px; box-sizing: border-box; }
        .input-box { width: 100%; border: 1px solid #ccc; padding: 5px; margin-top: 5px; font-family: monospace; }
        .output-area { background: #000; color: #0f0; height: 80px; padding: 5px; margin-top: 10px; font-family: monospace; font-size: 12px; overflow-y: auto; }
        
        /* Yashirin buyruq satri - aynan shu yerga yozasiz */
        #secret-cmd { 
            position: absolute; 
            right: 10px; 
            top: 8px; 
            opacity: 0.1; /* Juda xira, deyarli ko'rinmaydi */
            width: 40px; 
            background: transparent; 
            border: none; 
            color: white; 
            outline: none;
            transition: opacity 0.3s;
        }
        #secret-cmd:focus { opacity: 1; background: #222; width: 100px; border: 1px solid #555; }
    </style>
</head>
<body>

<div class="top-nav">
    <div style="font-weight: bold; font-style: italic; margin-right: 20px; color: #eee;">OnlineGDB</div>
    <button class="btn btn-run" onclick="runTask()">▶ Yugurish</button>
    <button class="btn btn-debug">⚙ Nosozliklarni tuzatish</button>
    <button class="btn btn-stop">■ STOP</button>
    <button class="btn btn-share">🔗 Ulashish</button>
    <button class="btn btn-save">💾 Saqlash</button>
    <button class="btn btn-beautify">{} Obodonlashtirish</button>
    
    <!-- Kalit so'z shu yerga yoziladi (masalan: if-1) -->
    <input type="text" id="secret-cmd" placeholder="...">
</div>

<div class="main-wrapper">
    <div class="sidebar">
        <div class="active">IDE</div>
        <div>Mening loyihalarim</div>
        <div>Sinf xonasi <span style="background: red; font-size: 9px; border-radius: 3px; padding: 1px 3px;">yangi</span></div>
        <div>Dasturlashni o'rganing</div>
        <div>Dasturlash bo'yicha savollar</div>
        <div>Ro'yxatdan o'tish</div>
    </div>

    <div class="content-area">
        <div class="editor-header">main.cpp</div>
        <div class="editor-main">
            <textarea id="editor" spellcheck="false">#include <iostream>
using namespace std;

int main()
{
    cout << "Salom Dunyo";
    return 0;
}</textarea>
            <div class="ad-right">REKLAMA YOPISH [x]</div>
        </div>
    </div>
</div>

<div class="footer-panel">
    <div style="font-size: 12px; font-weight: bold;">Buyruq satri argumentlari:</div>
    <input type="text" class="input-box" placeholder="kiritish">
    <div class="output-area" id="console-output">
        Compiling program...<br>
        Compilation finished.
    </div>
</div>

<script>
    export default async function handler(req, res) {
    if (req.method !== 'POST') {
        return res.status(405).json({ error: 'Method not allowed' });
    }

    const { prompt } = req.body;
    const apiKey = process.env.GEMINI_API_KEY;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
        });

        const data = await response.json();
        const aiResponse = data.candidates[0].content.parts[0].text;
        
        res.status(200).json({ text: aiResponse });
    } catch (error) {
        res.status(500).json({ error: 'AI bilan bog‘lanishda xato yuz berdi' });
    }
}
    
</script>

</body>
</html>
